server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    # Binding errors are useful to clients; stack traces and internal messages are not.
    include-message: on_param
    include-binding-errors: always
    include-stacktrace: never
  tomcat:
    # Caps the work an unauthenticated caller can force per request.
    max-http-form-post-size: 64KB
    max-swallow-size: 128KB
    threads:
      max: 50
  max-http-request-header-size: 16KB

spring:
  application:
    name: monolith-api
  lifecycle:
    # Must stay under the Cloud Run SIGTERM grace period so buffered writes drain.
    timeout-per-shutdown-phase: 15s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Health output is public (Cloud Run probes it unauthenticated); do not leak component detail.
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: monolith-api

dashboard:
  api-key: ${API_KEY:}
  allowed-email: ${ALLOWED_EMAIL:}
  gcp:
    project-id: ${GCP_PROJECT_ID:portfolio-api-505006}

# Client registry (names + read scope + report allotment; no secrets). Non-owner keys come from
# the aggregated MONOLITH_CLIENT_KEYS secret. See com.dashboard.api.security.ClientRegistry.
monolith:
  clients-file: ${MONOLITH_CLIENTS_FILE:classpath:clients.json}

# Report catalog and per-run cost guards. See com.dashboard.api.reports.ReportRegistry.
reports:
  file: ${MONOLITH_REPORTS_FILE:classpath:reports.json}
  max-bytes-billed: ${REPORTS_MAX_BYTES_BILLED:200000000}
  timeout-millis: ${REPORTS_TIMEOUT_MILLIS:30000}
  max-rows: ${REPORTS_MAX_ROWS:50000}

# Secret. Must be injected from Google Secret Manager; never commit a default here.
discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

# Ingest pipeline. See com.dashboard.api.config.AuditProperties. bigquery-* fields have no
# entry here — they bind by relaxed env-var matching (AUDIT_BIGQUERY_ENABLED, etc.) straight
# to their @DefaultValue when unset, same as if they were listed.
audit:
  max-map-entries: 32
  max-value-length: 512
  max-map-depth: 4
  rate-limit-per-minute: ${AUDIT_RATE_LIMIT_PER_MINUTE:120}
  global-rate-limit-per-minute: ${AUDIT_GLOBAL_RATE_LIMIT_PER_MINUTE:300}
  # Read path (GET /audit/logs). A read is a BigQuery scan, hence the tighter rate limit and
  # the lookback window / bytes-billed cap that bound how much any one query can cost.
  read-rate-limit-per-minute: ${AUDIT_READ_RATE_LIMIT_PER_MINUTE:30}
  query-default-limit: ${AUDIT_QUERY_DEFAULT_LIMIT:50}
  query-max-limit: ${AUDIT_QUERY_MAX_LIMIT:200}
  query-lookback-days: ${AUDIT_QUERY_LOOKBACK_DAYS:30}
  query-max-bytes-billed: ${AUDIT_QUERY_MAX_BYTES_BILLED:100000000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.dashboard.api: ${LOG_LEVEL:INFO}
    # gRPC (used by the BigQuery client) logs a channel-state line per RPC at INFO, which is
    # pure noise on Cloud Run and is billed as log ingestion.
    io.grpc: WARN
